# Filebeat Configuration for Docker Container Log Collection
# Collects logs from all Docker containers and sends to Elasticsearch

filebeat.config:
  modules:
    path: ${path.config}/modules.d/*.yml
    reload.enabled: false

# Autodiscover disabled due to Docker API version compatibility
# Using simple container input instead
# filebeat.autodiscover:
#   providers:
#     - type: docker

# Input configuration for container logs
filebeat.inputs:
  - type: container
    enabled: true
    # Path to Docker container logs
    paths:
      - '/var/lib/docker/containers/*/*.log'
    # Stream type (all, stdout, stderr)
    stream: all
    # Docker logs are already in JSON format, don't try to parse again
    
# Processors to enrich logs with metadata
processors:
  # Add Docker metadata (container name, ID, image, labels)
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
      match_fields: ["container.id"]
      match_pids: ["process.pid", "process.ppid"]
      match_source: true
      match_source_index: 4
      match_short_id: true
      cleanup_timeout: 60
      labels.dedot: true
      # Add container labels
      labels.enabled: true
  
  # Add hostname
  - add_host_metadata:
      when.not.contains.tags: forwarded
  
  # Add cloud metadata if running in cloud
  - add_cloud_metadata: ~

# Elasticsearch output configuration
output.elasticsearch:
  # Elasticsearch hosts
  hosts: ["elasticsearch:9200"]
  # Index naming pattern
  index: "filebeat-%{[agent.version]}-%{+yyyy.MM.dd}"
  # Number of workers
  workers: 1
  # Compression level (0-9, 0=no compression)
  compression_level: 0
  # Bulk max size
  bulk_max_size: 50

# Index lifecycle
setup.ilm.enabled: false
setup.template.name: "filebeat"
setup.template.pattern: "filebeat-*"
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0

# Kibana configuration for dashboards
setup.kibana:
  host: "kibana:5601"

# Logging configuration
logging.level: info
logging.to_files: false
logging.to_syslog: false
logging.json: true
logging.metrics.enabled: false
